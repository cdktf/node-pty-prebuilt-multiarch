name: "Release"

on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Add --dry-run flag to npm publish"
        default: true
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  release:
    runs-on: ubuntu-latest
    needs:
      - prebuild
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org" # required to use auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: prebuilds
          merge-multiple: true
      - run: tree prebuilds
      - run: yarn install --ignore-scripts --ignore-engines
      - run: yarn build
      - run: yarn
      - run: yarn test
      - name: Simulate Publishing to NPM
        if: ${{ inputs.dryrun }}
        run: npm publish --access public --dry-run
      - name: Publish to NPM
        if: ${{ !inputs.dryrun }}
        run: npm publish --access public
