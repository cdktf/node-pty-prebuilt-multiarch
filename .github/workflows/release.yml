name: "Release"

on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Add --dry-run flag to npm publish"
        default: true
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  release:
    runs-on: ubuntu-latest
    needs:
      - prebuild
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org" # required to use auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: prebuilds
          merge-multiple: true
      - run: tree prebuilds
      - run: yarn install --ignore-scripts --ignore-engines
      - run: yarn build
      - run: yarn
      - run: yarn test
      - name: Simulate Publishing to NPM
        if: ${{ inputs.dryrun }}
        run: npm publish --access public --dry-run
      - name: Publish to NPM
        if: ${{ !inputs.dryrun }}
        run: npm publish --access public
