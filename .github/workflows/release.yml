name: "Release"

on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Add --dry-run flag to npm publish"
        default: true
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml
    with:
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}

  release:
    runs-on: ubuntu-latest
    needs:
      - prebuild
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org" # required to use auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: prebuilds
          merge-multiple: true
      - run: tree prebuilds
      - run: yarn install --ignore-scripts --ignore-engines
      - run: yarn build
      - run: yarn
      - run: yarn test
      - name: Simulate Publishing to NPM
        if: ${{ inputs.dryrun }}
        run: npm publish --access public --dry-run
      - name: Publish to NPM
        if: ${{ !inputs.dryrun }}
        run: npm publish --access public
