name: "Prebuild"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        description: The SHA ref of the commit to check out
        type: string
        default: ${{ github.head_ref || github.ref }}
      repository:
        required: true
        description: The fully qualified name of the repository to check out the commit from
        type: string
        default: ${{ github.repository }}
      node_version:
        required: false
        description: Version of Node to use for setup-node
        type: string
        default: 20.x

permissions:
  contents: read

jobs:
  prebuild:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name:
          [
            alpine-x86_64,
            alpine-arm32v6,
            alpine-arm64v8,
            debian-x86_64,
            debian-i386,
            debian-arm32v6,
            debian-arm64v8,
            darwin-x86_64,
            darwin-arm64,
            windows-x86_64,
          ]
        include:
          - name: alpine-x86_64
            os: ubuntu-latest
            BASE_IMAGE: library/node:16-alpine
            DOCKERFILE: Dockerfile.alpine
            QEMU_ARCH: x86_64

          - name: alpine-arm32v6
            os: ubuntu-latest
            BASE_IMAGE: arm32v6/node:16-alpine
            DOCKERFILE: Dockerfile.alpine
            QEMU_ARCH: arm

          - name: alpine-arm64v8
            os: ubuntu-latest
            BASE_IMAGE: arm64v8/node:16-alpine
            DOCKERFILE: Dockerfile.alpine
            QEMU_ARCH: aarch64

          - name: debian-x86_64
            os: ubuntu-latest
            BASE_IMAGE: library/debian:11.7-slim
            DOCKERFILE: Dockerfile.debian
            QEMU_ARCH: x86_64

          - name: debian-i386
            os: ubuntu-latest
            BASE_IMAGE: i386/debian:11.7-slim
            DOCKERFILE: Dockerfile.debian
            QEMU_ARCH: i386

          - name: debian-arm32v6
            os: ubuntu-latest
            BASE_IMAGE: balenalib/raspberry-pi-debian:bullseye
            DOCKERFILE: Dockerfile.debian
            QEMU_ARCH: arm

          - name: debian-arm64v8
            os: ubuntu-latest
            BASE_IMAGE: arm64v8/debian:11.7-slim
            DOCKERFILE: Dockerfile.debian
            QEMU_ARCH: aarch64

          - name: darwin-x86_64
            os: macOS-latest

          - name: darwin-arm64
            # xlarge is arm64
            # https://docs.github.com/en/actions/using-github-hosted-runners/about-larger-runners/about-larger-runners#about-macos-larger-runners
            os: macos-13-xlarge

          - name: windows-x86_64
            os: windows-2022

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Linux - Setup Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get --yes --no-install-recommends install binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static:register --reset

      - name: Linux - Build Docker Image
        if: runner.os == 'Linux'
        run: |
          docker build -f .prebuild/${{ matrix.DOCKERFILE }} --build-arg BASE_IMAGE=${{ matrix.BASE_IMAGE }} --build-arg QEMU_ARCH=${{ matrix.QEMU_ARCH }} -t multiarch-build .

      - name: Linux - Prebuild Binaries
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v $(pwd):/node-pty multiarch-build

      - name: macOS - Setup Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          architecture: x64

      - name: macOS - Prebuild Binaries
        if: runner.os == 'macOS'
        run: |
          corepack enable # we use yarn
          yarn install --ignore-scripts --ignore-engines
          node .prebuild/buildify.js

      - name: Windows - Prebuild Binaries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          yarn install --ignore-scripts --ignore-engines
          node .prebuild/buildify-windows.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: prebuilds
          include-hidden-files: true
